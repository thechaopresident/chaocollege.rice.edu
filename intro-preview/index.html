<!doctype html>
<html lang="en" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro preview — Chao College</title>
<meta name="description" content="Prototype of the scroll intro. Not part of the live site.">
<meta name="robots" content="noindex">


<!-- FONT-LINK — uncomment and set the family once the branding sheet arrives,
     then put that family name first in --font-display / --font-body.
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=FAMILY:wght@400;600;700&display=swap">
-->

<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/intro.css">
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
</head>

<body data-page="home">
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" data-site-header></header>


<!-- The intro sits in front of the homepage, which stays in the document
     underneath it the whole time. -->
<section class="intro" data-intro aria-label="Introduction">
  <div class="intro__stage">
    <img class="intro__crest" src="../assets/img/crest.png" alt="" aria-hidden="true">
    <p class="intro__wordmark">Chao College
      <span class="intro__motto">Una Domus, Multae Viae</span>
    </p>
    <button class="intro__skip" type="button">Skip</button>
    <p class="intro__hint" aria-hidden="true">
      <span>Scroll to continue</span>
      <span class="intro__chevron"></span>
    </p>
  </div>
</section>

<main id="main">
  <!-- Hero: this element becomes the hero; content comes from data/site.js -->
  <section data-mount="hero"></section>

  <section class="section" data-mount="welcome"></section>
  <section class="section section--tint" id="announcements" data-mount="announcements"></section>
  <section class="section" data-mount="photos"></section>
  <section data-mount="locate"></section>
</main>

<footer class="site-footer" data-site-footer></footer>

<script src="../data/site.js"></script>
<script src="../data/people.js"></script>
<script src="../data/pages.js"></script>
<script src="../assets/js/site.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="../assets/js/intro.js"></script>

</body>
</html>
